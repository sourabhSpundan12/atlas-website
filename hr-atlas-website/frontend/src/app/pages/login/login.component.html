<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo-symbol">
        <i class="fa-solid fa-layer-group"></i>
      </div>
      <h2 class="auth-title">Sign In to HR Atlas</h2>
      <p class="auth-subtitle">Access your organisation workspace, payroll records, and team management portal.</p>
    </div>

    <div class="alert alert-danger" *ngIf="errorMessage">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span>{{ errorMessage }}</span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Work Email Address</label>
        <input
          id="email"
          type="email"
          class="form-control"
          placeholder="name@company.com"
          formControlName="email"
          [class.is-invalid]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
        />
        <div class="invalid-feedback" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
          Please enter a valid work email address.
        </div>
      </div>

      <div class="form-group">
        <div class="label-with-link">
          <label for="password">Password</label>
          <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
        </div>
        <input
          id="password"
          type="password"
          class="form-control"
          placeholder="Enter your account password"
          formControlName="password"
          [class.is-invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
        />
        <div class="invalid-feedback" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          Password is required.
        </div>
      </div>

      <div class="form-options">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="rememberMe" />
          <span>Keep me signed in on this device</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" [disabled]="isLoading">
        <span *ngIf="!isLoading">Sign In to Workspace</span>
        <span *ngIf="isLoading"><span class="spinner"></span> Authenticating...</span>
        <i *ngIf="!isLoading" class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <div class="auth-footer">
      <p>
        Don't have an organisation workspace yet?
        <a routerLink="/signup" class="signup-link">Start 14-day free trial</a>
      </p>
    </div>
  </div>
</div>
